<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Back Room Stock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#17130f;--ink-2:#4a423a;--paper:#ffffff;--panel:#efece5;--line:#d8d2c7;
    --accent:#c0322a;--accent-ink:#8f231d;--good:#2f7d4f;--warn:#b7791f;--zone-bg:#e7e2d8;
    --radius:10px;--shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -18px rgba(0,0,0,.5);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--panel);-webkit-text-size-adjust:100%;line-height:1.4}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 120px}

  header.app{position:sticky;top:0;z-index:20;background:var(--ink);color:#f6f2ea;margin:0 -14px;padding:14px 16px 12px;border-bottom:3px solid var(--accent)}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c9beac;font-weight:700}
  #mode{color:var(--good);letter-spacing:.1em}
  .app h1{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .store-line{display:flex;align-items:baseline;gap:8px;margin-top:6px}
  .store-line input{background:transparent;border:none;border-bottom:1px dashed #6b6055;color:#f6f2ea;font-family:var(--mono);font-size:13px;padding:2px 2px;width:auto;min-width:120px}
  .store-line input:focus{outline:none;border-bottom-color:var(--accent)}
  .totals{display:flex;gap:16px;margin-top:12px}
  .totals .stat{font-family:var(--mono)}
  .totals .num{font-size:20px;font-weight:700;display:block;line-height:1}
  .totals .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c9beac}

  .toolbar{display:flex;gap:8px;margin:14px 0 10px}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:0 12px}
  .search input{border:none;outline:none;flex:1;padding:12px 0;font-size:16px;background:transparent}
  .search svg{flex:none}
  .btn{font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;border-radius:var(--radius);border:1px solid transparent;padding:12px 16px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-ink)}
  .btn-ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover{background:#faf8f4}
  .btn-block{width:100%}
  .row-actions{display:flex;gap:8px;margin-bottom:16px}

  .zone{margin:18px 0 0}
  .zone-head{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
  .zone-tag{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--zone-bg);color:var(--ink);border:1px solid var(--line);padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .zone-count{font-size:12px;color:var(--ink-2);font-family:var(--mono)}
  .zone-line{flex:1;height:1px;background:var(--line)}

  .item{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 12px 12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;position:relative;overflow:hidden}
  .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .item.flash{animation:flash .8s ease}
  @keyframes flash{0%{background:#fff7d9}100%{background:#fff}}
  .item .name{font-size:16px;font-weight:700;letter-spacing:-.01em;grid-column:1;min-width:0;overflow-wrap:anywhere}
  .item .meta{grid-column:1;display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .item .meta .upc{color:var(--ink)}
  .item .meta .when{color:#8a8074}
  .qtybox{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:6px}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#faf8f4}
  .stepper button{border:none;background:transparent;width:38px;height:40px;font-size:20px;font-weight:700;cursor:pointer;color:var(--ink);line-height:1}
  .stepper button:hover{background:#efeae1}
  .stepper .qty{width:44px;text-align:center;font-family:var(--mono);font-size:19px;font-weight:700;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:8px 0;background:#fff;-moz-appearance:textfield}
  .stepper .qty::-webkit-outer-spin-button,.stepper .qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .kebab{border:none;background:transparent;cursor:pointer;padding:6px;color:var(--ink-2);align-self:start}
  .kebab:hover{color:var(--ink)}

  .empty{text-align:center;padding:48px 20px;color:var(--ink-2);background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);margin-top:6px}
  .empty h3{margin:0 0 6px;color:var(--ink);font-size:17px}
  .empty p{margin:0 auto;max-width:320px;font-size:14px}
  .loading{text-align:center;padding:40px;color:var(--ink-2);font-family:var(--mono);font-size:13px}

  .fab{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(to top,var(--panel) 70%,rgba(239,236,229,0));padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .fab .inner{max-width:640px;margin:0 auto;display:flex;gap:8px}

  .scrim{position:fixed;inset:0;background:rgba(23,19,15,.5);z-index:40;display:none}
  .scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:16px 16px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;max-width:640px;margin:0 auto;box-shadow:0 -10px 40px -20px rgba(0,0,0,.6)}
  .sheet.on{transform:translateY(0)}
  .sheet h2{margin:2px 0 14px;font-size:18px}
  .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
  .field input{width:100%;padding:13px 12px;font-size:16px;border:1px solid var(--line);border-radius:9px;font-family:var(--sans);background:#fff}
  .field input.mono{font-family:var(--mono)}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,50,42,.12)}
  .upc-row{display:flex;gap:8px}
  .upc-row input{flex:1}
  .upc-scan{flex:none;width:50px;border:1px solid var(--line);border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .upc-scan:active{transform:translateY(1px)}
  .hint{font-size:12px;color:var(--ink-2);margin-top:5px;font-weight:400;text-transform:none;letter-spacing:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sheet-actions{display:flex;gap:8px;margin-top:6px}
  .danger{color:var(--accent);background:#fff;border-color:var(--line)}
  .danger:hover{background:#fcefee}

  .scanner{position:fixed;inset:0;z-index:60;background:#0b0a09;display:none;flex-direction:column}
  .scanner.on{display:flex}
  .scanner-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#fff;font-weight:700;font-size:16px}
  .scanner-top button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
  #reader{flex:1;min-height:0;width:100%;overflow:hidden;position:relative}
  #reader video{width:100% !important;height:100% !important;object-fit:cover}
  .scanner-bottom{padding:16px;text-align:center;color:#fff}
  .scanner-bottom .hint2{display:block;font-size:13px;color:#cfcfcf;margin-bottom:10px}
  .scanner-bottom button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer}
  .scanner-error{margin:16px;padding:14px;background:#2a2320;border:1px solid #5a4b44;color:#f4d9c9;border-radius:10px;font-size:14px;text-align:center;line-height:1.5}

  #print-root{display:none}
  @media print{
    @page{margin:12mm}
    body{background:#fff}
    .wrap,.fab,header.app,.scrim,.sheet,.scanner{display:none !important}
    #print-root{display:block}
    .p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
    .p-title{font-size:20px;font-weight:800;font-family:var(--sans)}
    .p-sub{font-size:11px;font-family:var(--mono)}
    .p-qr{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
    .p-qr svg{width:96px;height:96px;display:block}
    .p-qr .l{font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);text-align:center;max-width:110px}
    .p-zone{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #000;padding:10px 0 3px;margin-top:8px}
    .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
    .p-item{border:1px solid #bbb;border-radius:6px;padding:8px 10px;margin:6px;display:flex;align-items:center;justify-content:space-between;gap:10px;break-inside:avoid}
    .p-left{min-width:0}
    .p-name{font-size:13px;font-weight:700;font-family:var(--sans);overflow-wrap:anywhere}
    .p-bc svg{display:block;max-width:150px;height:auto}
    .p-qty{text-align:center;font-family:var(--mono);flex:none}
    .p-qty .n{font-size:26px;font-weight:800;line-height:1;display:block}
    .p-qty .l{font-size:8px;letter-spacing:.1em;text-transform:uppercase}
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="app">
  <div class="eyebrow">Casey&rsquo;s &middot; Center Store<span id="mode"></span></div>
  <h1>Back Room Stock</h1>
  <div class="store-line">
    <span class="eyebrow" style="letter-spacing:.1em">Store</span>
    <input id="storeName" placeholder="e.g. #2087 Sutton" aria-label="Store name or number" />
  </div>
  <div class="totals">
    <div class="stat"><span class="num" id="tItems">0</span><span class="cap">Items</span></div>
    <div class="stat"><span class="num" id="tUnits">0</span><span class="cap">Units</span></div>
    <div class="stat"><span class="num" id="tZones">0</span><span class="cap">Zones</span></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8074" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
      <input id="search" type="search" placeholder="Search name, UPC, or zone" aria-label="Search" />
    </label>
  </div>

  <div class="row-actions">
    <button class="btn btn-ghost btn-block" id="printBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
      Print door sheet
    </button>
  </div>

  <div id="list"><div class="loading">Loading back room&hellip;</div></div>
</div>

<div class="fab">
  <div class="inner">
    <button class="btn btn-primary btn-block" id="scanBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Scan
    </button>
    <button class="btn btn-ghost" id="addBtn" style="flex:0 0 auto">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <h2 id="sheetTitle">Add item</h2>
  <div class="field">
    <label for="fUpc">UPC / barcode</label>
    <div class="upc-row">
      <input id="fUpc" class="mono" inputmode="numeric" autocomplete="off" placeholder="Scan or type" />
      <button type="button" class="upc-scan" id="fUpcScan" aria-label="Scan barcode with camera">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </div>
    <div class="hint">Tap the camera to scan with your phone, or type the UPC. This is what prints as the scannable barcode.</div>
  </div>
  <div class="field">
    <label for="fName">Item</label>
    <input id="fName" autocomplete="off" placeholder="e.g. Monster Zero 16oz" />
  </div>
  <div class="two">
    <div class="field">
      <label for="fQty">Cases / units in back</label>
      <input id="fQty" class="mono" inputmode="numeric" type="number" min="0" value="1" />
    </div>
    <div class="field">
      <label for="fZone">Zone</label>
      <input id="fZone" list="zones" autocomplete="off" placeholder="e.g. Beverage" />
      <datalist id="zones"></datalist>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn danger" id="deleteBtn" style="display:none">Delete</button>
    <button class="btn btn-primary btn-block" id="saveBtn">Save item</button>
  </div>
</div>

<div class="scanner" id="scanner" role="dialog" aria-modal="true" aria-label="Barcode scanner">
  <div class="scanner-top">
    <span id="scanTitle">Scan a barcode</span>
    <button id="scanClose">Close</button>
  </div>
  <div id="reader"></div>
  <div id="scanError" class="scanner-error" style="display:none"></div>
  <div class="scanner-bottom">
    <span class="hint2" id="scanHint">Point the camera at the product barcode</span>
    <button id="scanManual">Type it instead</button>
  </div>
</div>

<div id="print-root"></div>

<script>
(function(){
  "use strict";

  /* =======================================================================
     CONFIG  --  paste your Supabase Project URL + anon public key here.
     Find them in Supabase: Project Settings -> API.
     Leave both blank to run on this device's local storage (no sync).
     ======================================================================= */
  var CONFIG = {
    SUPABASE_URL: "https://uzrqjbewlcokvhedqrzd.supabase.co",        // e.g. "https://abcdxyz.supabase.co"
    SUPABASE_ANON_KEY: "sb_publishable_UWZAPZC3alMJKaSzSlL7TQ_IydmWAMl",    // the "anon public" key
    APP_URL: ""   // blank = use this page's own URL for the printed QR
  };
  /* ======================================================================= */

  var KEY_ITEMS = "backroom:items";   // used only in local fallback mode
  var KEY_STORE = "backroom:store";
  var BACKEND = "local";
  var sb = null;

  var items = [];
  var editingId = null;
  var lastZone = "";

  var $ = function(s){ return document.querySelector(s); };
  var listEl = $("#list");

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function idxOf(id){ for(var i=0;i<items.length;i++){ if(items[i].id===id) return i; } return -1; }

  /* ---------- local fallback storage (Claude preview / no keys) ---------- */
  function localGet(key){
    try{ return window.storage.get(key, true).then(function(r){ return r?r.value:null; }).catch(function(){ return null; }); }
    catch(e){ return Promise.resolve(null); }
  }
  function localSet(key,val){
    try{ return window.storage.set(key, val, true).catch(function(){}); }
    catch(e){ return Promise.resolve(); }
  }

  /* ---------- backend init ---------- */
  function initBackend(){
    if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient){
      try{ sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); BACKEND = "supabase"; }
      catch(e){ BACKEND = "local"; }
    }
  }
  function itemFromRow(r){ return {id:r.id, upc:r.upc||"", name:r.name||"", qty:Number(r.qty)||0, zone:r.zone||"", updated:Number(r.updated)||0}; }
  function rowFromItem(it){ return {id:it.id, upc:it.upc||"", name:it.name||"", qty:Number(it.qty)||0, zone:it.zone||"", updated:it.updated||Date.now()}; }

  /* ---------- persistence (dispatch on backend) ---------- */
  function saveItem(it){
    if(BACKEND==="supabase"){
      sb.from("backroom_items").upsert(rowFromItem(it)).then(function(res){ if(res && res.error) console.error(res.error); });
    }else{
      localSet(KEY_ITEMS, JSON.stringify(items));
    }
  }
  function deleteItemRemote(id){
    if(BACKEND==="supabase"){
      sb.from("backroom_items").delete().eq("id", id).then(function(res){ if(res && res.error) console.error(res.error); });
    }else{
      localSet(KEY_ITEMS, JSON.stringify(items));
    }
  }
  function saveStoreName(v){
    if(BACKEND==="supabase"){
      sb.from("backroom_meta").upsert({id:"store", value:v}).then(function(res){ if(res && res.error) console.error(res.error); });
    }else{
      localSet(KEY_STORE, v);
    }
  }

  /* ---------- load + realtime ---------- */
  function load(){
    initBackend();
    if(BACKEND==="supabase"){
      $("#mode").textContent = " \u00b7 Live sync on";
      return sb.from("backroom_items").select("*").then(function(res){
        items = ((res && res.data) || []).map(itemFromRow);
        return sb.from("backroom_meta").select("value").eq("id","store").maybeSingle();
      }).then(function(res){
        if(res && res.data && res.data.value){ $("#storeName").value = res.data.value; }
        render(); subscribeRealtime();
      }).catch(function(e){ console.error(e); render(); });
    }
    return localGet(KEY_ITEMS).then(function(raw){
      if(raw){ try{ items = JSON.parse(raw)||[]; }catch(e){ items = []; } }
      return localGet(KEY_STORE);
    }).then(function(store){ if(store){ $("#storeName").value = store; } render(); });
  }

  function subscribeRealtime(){
    try{
      sb.channel("backroom-sync")
        .on("postgres_changes", {event:"*", schema:"public", table:"backroom_items"}, function(p){
          if(p.eventType==="DELETE"){
            var oid = p.old && p.old.id; if(oid) items = items.filter(function(x){ return x.id!==oid; });
          }else if(p.new){
            var it = itemFromRow(p.new); var i = idxOf(it.id);
            if(i>=0) items[i] = it; else items.push(it);
          }
          render();
        })
        .on("postgres_changes", {event:"*", schema:"public", table:"backroom_meta"}, function(p){
          if(p.new && p.new.id==="store"){ $("#storeName").value = p.new.value||""; }
        })
        .subscribe();
    }catch(e){ console.error(e); }
  }

  /* ---------- helpers ---------- */
  function fmtWhen(ts){
    if(!ts) return "";
    var d = new Date(ts), now = new Date();
    if(d.toDateString() === now.toDateString()) return "today " + d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    return d.toLocaleDateString([], {month:"short", day:"numeric"});
  }
  function grouped(filter){
    var f = (filter||"").trim().toLowerCase(), out = {};
    items.forEach(function(it){
      if(f){ if((it.name+" "+it.upc+" "+it.zone).toLowerCase().indexOf(f) === -1) return; }
      var z = it.zone || "Unzoned"; (out[z] = out[z] || []).push(it);
    });
    Object.keys(out).forEach(function(z){ out[z].sort(function(a,b){ return a.name.localeCompare(b.name); }); });
    return out;
  }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function find(id){ var i=idxOf(id); return i>=0?items[i]:null; }
  function findByUpc(u){ u=(u||"").trim(); if(!u) return null; for(var i=0;i<items.length;i++){ if((items[i].upc||"")===u) return items[i]; } return null; }

  /* ---------- render ---------- */
  function render(){
    $("#tItems").textContent = items.length;
    $("#tUnits").textContent = items.reduce(function(s,i){ return s + (Number(i.qty)||0); }, 0);
    var zones = {}; items.forEach(function(i){ zones[i.zone||"Unzoned"] = 1; });
    $("#tZones").textContent = Object.keys(zones).length;

    var dl = $("#zones"); dl.innerHTML = "";
    Object.keys(zones).sort().forEach(function(z){ if(z==="Unzoned") return; var o=document.createElement("option"); o.value=z; dl.appendChild(o); });

    var q = $("#search").value, g = grouped(q), zoneKeys = Object.keys(g).sort();

    if(items.length === 0){
      listEl.innerHTML = '<div class="empty"><h3>Nothing logged yet</h3>'+
        '<p>Tap Scan and point your phone at a product to add it, so a Smart Count never misses what&rsquo;s stacked in back.</p></div>';
      return;
    }
    if(zoneKeys.length === 0){
      listEl.innerHTML = '<div class="empty"><h3>No matches</h3><p>Nothing here matches &ldquo;'+esc(q)+'&rdquo;.</p></div>';
      return;
    }

    var html = "";
    zoneKeys.forEach(function(z){
      var arr = g[z], units = arr.reduce(function(s,i){ return s+(Number(i.qty)||0); },0);
      html += '<section class="zone"><div class="zone-head">'+
        '<span class="zone-tag">'+esc(z)+'</span>'+
        '<span class="zone-count">'+arr.length+' item'+(arr.length!==1?"s":"")+' &middot; '+units+' units</span>'+
        '<span class="zone-line"></span></div>';
      arr.forEach(function(it){
        html += '<div class="item" data-id="'+it.id+'">'+
          '<div class="name">'+esc(it.name)+'</div>'+
          '<div class="meta"><span class="upc">'+esc(it.upc||"no UPC")+'</span>'+
            (it.updated?'<span class="when">'+fmtWhen(it.updated)+'</span>':'')+'</div>'+
          '<div class="qtybox"><div class="stepper">'+
              '<button data-act="dec" aria-label="Decrease">&minus;</button>'+
              '<input class="qty" data-act="set" inputmode="numeric" type="number" min="0" value="'+(Number(it.qty)||0)+'" aria-label="Quantity" />'+
              '<button data-act="inc" aria-label="Increase">+</button>'+
            '</div>'+
            '<button class="kebab" data-act="edit" aria-label="Edit item">'+
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>'+
            '</button></div>'+
        '</div>';
      });
      html += '</section>';
    });
    listEl.innerHTML = html;
  }

  /* ---------- item ops (optimistic local update, then persist) ---------- */
  function adjust(id, delta){
    var it = find(id); if(!it) return;
    it.qty = Math.max(0, (Number(it.qty)||0) + delta); it.updated = Date.now();
    render(); flash(id); saveItem(it);
  }
  function setQty(id, val){
    var it = find(id); if(!it) return;
    it.qty = Math.max(0, Math.floor(Number(val)||0)); it.updated = Date.now(); saveItem(it);
  }
  function flash(id){
    var el = document.querySelector('.item[data-id="'+id+'"]');
    if(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }

  function openSheet(id){
    editingId = id || null;
    var t = $("#sheetTitle"), del = $("#deleteBtn");
    if(id){
      var it = find(id);
      t.textContent = "Edit item";
      $("#fUpc").value = it.upc||""; $("#fName").value = it.name||"";
      $("#fQty").value = it.qty!=null?it.qty:0; $("#fZone").value = it.zone||"";
      del.style.display = "inline-flex";
    }else{
      t.textContent = "Add item";
      $("#fUpc").value=""; $("#fName").value=""; $("#fQty").value="1"; $("#fZone").value = lastZone||"";
      del.style.display = "none";
    }
    $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
    setTimeout(function(){ $("#fUpc").focus(); }, 60);
  }
  function sheetIsOpen(){ return $("#sheet").classList.contains("on"); }
  function closeSheet(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); editingId = null; }

  function saveFromSheet(){
    var upc = $("#fUpc").value.trim(), name = $("#fName").value.trim();
    var qty = Math.max(0, Math.floor(Number($("#fQty").value)||0)), zone = $("#fZone").value.trim();
    if(!name){ $("#fName").focus(); return; }
    lastZone = zone;
    var it;
    if(editingId){
      it = find(editingId); it.upc=upc; it.name=name; it.qty=qty; it.zone=zone; it.updated=Date.now();
    }else{
      it = {id:uid(), upc:upc, name:name, qty:qty, zone:zone, updated:Date.now()}; items.push(it);
    }
    render(); saveItem(it); closeSheet();
  }
  function deleteCurrent(){
    if(!editingId) return;
    var id = editingId; items = items.filter(function(i){ return i.id!==id; });
    render(); deleteItemRemote(id); closeSheet();
  }

  /* ---------- scan flow ---------- */
  function handleScan(code){
    if(!code) return;
    var m = findByUpc(code);
    if(m){ openSheet(m.id); setTimeout(function(){ var q=$("#fQty"); q.focus(); if(q.select) q.select(); }, 90); }
    else { openSheet(null); $("#fUpc").value = code; setTimeout(function(){ $("#fName").focus(); }, 90); }
  }

  /* ---------- camera scanner ---------- */
  var Scanner = (function(){
    var qr=null, cb=null, active=false;
    function cameraOk(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
    function fmts(){ var F=window.Html5QrcodeSupportedFormats; if(!F) return undefined;
      return [F.UPC_A,F.UPC_E,F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.ITF]; }
    function showError(msg){ var el=$("#scanError"); el.textContent=msg; el.style.display="block"; }
    function open(title, onResult){
      cb = onResult; $("#scanTitle").textContent = title || "Scan a barcode";
      $("#scanError").style.display="none"; $("#scanner").classList.add("on");
      if(!window.Html5Qrcode || !cameraOk()){ showError("Camera scanning isn\u2019t available here. Open the hosted app on your phone (or type the code below)."); return; }
      try{
        qr = new Html5Qrcode("reader", { formatsToSupport: fmts(), verbose:false });
        var config = { fps:10, qrbox:function(vw){ var w=Math.min((vw||300)*0.82, 340); return {width:w, height:Math.max(120, Math.round(w*0.55))}; } };
        active = true;
        qr.start({facingMode:"environment"}, config, onDecoded, function(){})
          .catch(function(){ showError("Couldn\u2019t start the camera. Allow camera access for this page, or type the code below."); });
      }catch(e){ showError("Couldn\u2019t start the camera. Type the code below instead."); }
    }
    function onDecoded(text){ if(!active) return; active=false; var val=String(text).trim(); close().then(function(){ if(cb) cb(val); }); }
    function close(){
      $("#scanner").classList.remove("on"); var q=qr; qr=null; active=false;
      if(q){ try{ return q.stop().then(function(){ try{q.clear();}catch(_){} }).catch(function(){ try{q.clear();}catch(_){} }); }catch(e){ return Promise.resolve(); } }
      return Promise.resolve();
    }
    return { open:open, close:close };
  })();

  /* ---------- barcode (print) ---------- */
  function drawBarcode(svg, value){
    var v = (value||"").trim();
    if(!v){ svg.parentNode.innerHTML = '<div style="font:11px monospace;color:#999">no UPC</div>'; return; }
    var opts = {height:38, width:1.6, margin:0, fontSize:11, textMargin:1};
    try{
      if(/^\d{12}$/.test(v) || /^\d{11}$/.test(v)){ JsBarcode(svg, v, Object.assign({format:"UPC"}, opts)); return; }
      if(/^\d{13}$/.test(v)){ JsBarcode(svg, v, Object.assign({format:"EAN13"}, opts)); return; }
      JsBarcode(svg, v, Object.assign({format:"CODE128"}, opts));
    }catch(e){
      try{ JsBarcode(svg, v, Object.assign({format:"CODE128"}, opts)); }
      catch(_){ svg.parentNode.innerHTML = '<div style="font:11px monospace;color:#999">'+esc(v)+'</div>'; }
    }
  }
  function qrSvg(text, px){
    var v = (text||"").trim();
    if(!v || !window.qrcode) return "";
    try{
      var qr = window.qrcode(0, "M");
      qr.addData(v);
      qr.make();
      var count = qr.getModuleCount();
      var cell = Math.max(1, Math.floor((px||96)/count));
      return qr.createSvgTag({cellSize:cell, margin:0});
    }catch(e){ return ""; }
  }
  function buildPrint(){
    var root = $("#print-root"), store = $("#storeName").value.trim();
    var when = new Date().toLocaleDateString([], {year:"numeric", month:"short", day:"numeric"});
    var g = grouped(""), keys = Object.keys(g).sort();
    var appUrl = CONFIG.APP_URL || (location.origin + location.pathname);
    var html = '<div class="p-head"><div class="p-head-left"><div class="p-title">Back Room Stock'+(store?" &middot; "+esc(store):"")+'</div>'+
               '<div class="p-sub">'+items.length+' items &middot; printed '+when+'</div></div>'+
               '<div class="p-qr">'+qrSvg(appUrl, 96)+'<span class="l">Scan to open on your phone</span></div></div>';
    keys.forEach(function(z){
      html += '<div class="p-zone">'+esc(z)+'</div><div class="p-grid">';
      g[z].forEach(function(it){
        html += '<div class="p-item"><div class="p-left"><div class="p-name">'+esc(it.name)+'</div>'+
          '<div class="p-bc"><svg data-upc="'+esc(it.upc||"")+'"></svg></div></div>'+
          '<div class="p-qty"><span class="n">'+(Number(it.qty)||0)+'</span><span class="l">in back</span></div></div>';
      });
      html += '</div>';
    });
    root.innerHTML = html;
    root.querySelectorAll("svg[data-upc]").forEach(function(svg){ drawBarcode(svg, svg.getAttribute("data-upc")); });
  }

  /* ---------- events ---------- */
  $("#addBtn").addEventListener("click", function(){ openSheet(null); });
  $("#scanBtn").addEventListener("click", function(){ Scanner.open("Scan to count or add", handleScan); });
  $("#fUpcScan").addEventListener("click", function(){ Scanner.open("Scan barcode", function(code){ $("#fUpc").value = code; }); });
  $("#scanClose").addEventListener("click", function(){ Scanner.close(); });
  $("#scanManual").addEventListener("click", function(){ Scanner.close().then(function(){ if(!sheetIsOpen()) openSheet(null); setTimeout(function(){ $("#fUpc").focus(); }, 90); }); });

  $("#saveBtn").addEventListener("click", saveFromSheet);
  $("#deleteBtn").addEventListener("click", deleteCurrent);
  $("#scrim").addEventListener("click", closeSheet);
  $("#search").addEventListener("input", render);

  $("#fUpc").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); $("#fName").focus(); } });
  $("#fName").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); $("#fQty").focus(); } });
  $("#fQty").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); $("#fZone").focus(); } });
  $("#fZone").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); saveFromSheet(); } });

  $("#storeName").addEventListener("change", function(){ saveStoreName($("#storeName").value.trim()); });

  $("#printBtn").addEventListener("click", function(){
    if(items.length===0){ alert("Add some items first \u2014 the sheet builds from your back room list."); return; }
    buildPrint(); setTimeout(function(){ window.print(); }, 120);
  });

  listEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]"); if(!btn) return;
    var card = e.target.closest(".item"); if(!card) return;
    var id = card.getAttribute("data-id"), act = btn.getAttribute("data-act");
    if(act==="inc") adjust(id, +1);
    else if(act==="dec") adjust(id, -1);
    else if(act==="edit") openSheet(id);
  });
  listEl.addEventListener("change", function(e){
    var inp = e.target.closest('input[data-act="set"]'); if(!inp) return;
    var card = e.target.closest(".item"); if(!card) return;
    setQty(card.getAttribute("data-id"), inp.value);
  });

  document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ Scanner.close(); closeSheet(); } });

  load();
})();
</script>
</body>
</html>
